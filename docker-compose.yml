services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adrobot}
      POSTGRES_USER: ${POSTGRES_USER:-adrobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adrobot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adrobot} -d ${POSTGRES_DB:-adrobot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://adrobot:adrobot@db:5432/adrobot}
      KEITARO_API_KEY: ${KEITARO_API_KEY}
      KEITARO_BASE_URL: ${KEITARO_BASE_URL:-https://tlgk.host/admin_api/v1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Бэкенд не должен быть доступен напрямую извне — только через nginx.
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      network: host
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
